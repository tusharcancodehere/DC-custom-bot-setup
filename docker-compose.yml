services:
  db:
    image: postgres:16-alpine
    container_name: dc_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dc_custom_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-dc_custom_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: dc_custom_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dc_custom_bot}"
    volumes:
      - logs_data:/app/logs
      - audio_cache:/app/audio_cache

volumes:
  postgres_data:
  logs_data:
  audio_cache:
