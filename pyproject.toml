[project]
name = "dc-custom-bot-setup"
version = "1.0.1"
description = "A modular, hosting-friendly Discord bot built with discord.py"
readme = "README.md"
authors = [
    { name = "tushar", email = "thetusharverma2505@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "davey>=0.1.6",
    "discord-py>=2.7.1",
    "google-genai>=2.22.0",
    "openai>=3.8.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

