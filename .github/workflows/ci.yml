name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Syntax & Compilation Check
        run: uv run --python ${{ matrix.python-version }} python -m compileall -q src alembic tests

      - name: Apply Database Migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dc_bot_test"
        run: uv run --python ${{ matrix.python-version }} alembic upgrade head

      - name: Run Test Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/dc_bot_test"
        run: uv run --python ${{ matrix.python-version }} python -m unittest discover -s tests -v

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dc-custom-bot:latest
